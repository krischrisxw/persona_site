<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>롤링 셔터와 글로벌 셔터의 행별 노출 시점 비교</title><rect width="800" height="420" fill="#f7f7f4"/><g font-family="Arial,sans-serif" fill="#222"><text x="180" y="48" text-anchor="middle" font-size="21">롤링 셔터</text><text x="600" y="48" text-anchor="middle" font-size="21">글로벌 셔터</text><g fill="#8ecae6"><rect x="70" y="80" width="210" height="35"/><rect x="95" y="125" width="210" height="35"/><rect x="120" y="170" width="210" height="35"/><rect x="145" y="215" width="210" height="35"/><rect x="170" y="260" width="210" height="35"/></g><g fill="#2a9d8f"><rect x="475" y="80" width="245" height="35"/><rect x="475" y="125" width="245" height="35"/><rect x="475" y="170" width="245" height="35"/><rect x="475" y="215" width="245" height="35"/><rect x="475" y="260" width="245" height="35"/></g><text x="225" y="338" text-anchor="middle" font-size="16">행마다 노출 시작 시점이 다름</text><text x="598" y="338" text-anchor="middle" font-size="16">모든 행이 동시에 노출</text><line x1="70" y1="375" x2="720" y2="375" stroke="#777" stroke-width="2"/><text x="735" y="382" font-size="15">시간</text></g></svg>
