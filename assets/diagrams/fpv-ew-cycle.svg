<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>FPV 드론과 전자전의 대응 순환</title><rect width="800" height="420" fill="#f7f7f4"/><g font-family="Arial,sans-serif" fill="#222"><line x1="90" y1="210" x2="720" y2="210" stroke="#777" stroke-width="3"/><g><circle cx="140" cy="210" r="28" fill="#4d77a8"/><circle cx="310" cy="210" r="28" fill="#e76f51"/><circle cx="480" cy="210" r="28" fill="#2a9d8f"/><circle cx="650" cy="210" r="28" fill="#ffd28a"/></g><text x="140" y="155" text-anchor="middle" font-size="18">상용 FPV 확산</text><text x="310" y="285" text-anchor="middle" font-size="18">재머 보급</text><text x="480" y="155" text-anchor="middle" font-size="18">대역·출력 변경</text><text x="650" y="285" text-anchor="middle" font-size="18">탐지기 재설정</text><text x="400" y="370" text-anchor="middle" font-size="17" fill="#666">기체와 대응 장비가 수주·수개월 단위로 함께 변경</text></g></svg>
