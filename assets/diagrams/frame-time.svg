<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>60 120 240 헤르츠의 프레임 시간 비교</title><rect width="800" height="420" fill="#f7f7f4"/><g font-family="Arial,sans-serif" fill="#222"><text x="70" y="95" font-size="20">60 Hz</text><rect x="180" y="65" width="500" height="45" rx="6" fill="#e76f51"/><text x="700" y="94" font-size="17">16.7 ms</text><text x="70" y="205" font-size="20">120 Hz</text><rect x="180" y="175" width="250" height="45" rx="6" fill="#4d77a8"/><text x="450" y="204" font-size="17">8.3 ms</text><text x="70" y="315" font-size="20">240 Hz</text><rect x="180" y="285" width="125" height="45" rx="6" fill="#2a9d8f"/><text x="325" y="314" font-size="17">4.2 ms</text><text x="400" y="385" text-anchor="middle" font-size="17" fill="#666">주사율이 두 배가 되면 새 프레임까지의 최대 간격은 절반</text></g></svg>
