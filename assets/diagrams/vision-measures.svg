<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>화면 주사율과 관련된 서로 다른 시각 측정 항목</title><rect width="800" height="420" fill="#f7f7f4"/><g font-family="Arial,sans-serif" fill="#222" text-anchor="middle"><rect x="55" y="90" width="205" height="230" rx="12" fill="#8ecae6"/><rect x="298" y="90" width="205" height="230" rx="12" fill="#bde0a8"/><rect x="540" y="90" width="205" height="230" rx="12" fill="#ffd28a"/><text x="157" y="140" font-size="20">깜빡임 융합</text><text x="157" y="185" font-size="16">빛이 연속으로</text><text x="157" y="210" font-size="16">보이는 임계값</text><text x="400" y="140" font-size="20">운동 선명도</text><text x="400" y="185" font-size="16">이동 경계의</text><text x="400" y="210" font-size="16">흐림·계단 현상</text><text x="642" y="140" font-size="20">입력 지연</text><text x="642" y="185" font-size="16">새 정보가 화면에</text><text x="642" y="210" font-size="16">표시되는 간격</text><text x="400" y="375" font-size="17" fill="#666">세 항목은 같은 ‘최대 Hz’로 합칠 수 없음</text></g></svg>
