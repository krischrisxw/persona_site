<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>원자 간섭계의 세 레이저 펄스와 물질파 경로</title><rect width="800" height="420" fill="#f7f7f4"/><g font-family="Arial,sans-serif" fill="#222"><line x1="100" y1="340" x2="700" y2="340" stroke="#777" stroke-width="2"/><text x="715" y="346" font-size="16">시간</text><g stroke="#e76f51" stroke-width="8"><line x1="180" y1="65" x2="180" y2="350"/><line x1="400" y1="65" x2="400" y2="350"/><line x1="620" y1="65" x2="620" y2="350"/></g><path d="M100 300 L180 260 L400 120 L620 260 L700 300" fill="none" stroke="#4d77a8" stroke-width="5"/><path d="M100 300 L180 260 L400 300 L620 260 L700 300" fill="none" stroke="#2a9d8f" stroke-width="5"/><text x="180" y="42" text-anchor="middle" font-size="16">분할</text><text x="400" y="42" text-anchor="middle" font-size="16">반사</text><text x="620" y="42" text-anchor="middle" font-size="16">재결합</text><text x="400" y="395" text-anchor="middle" font-size="17" fill="#666">가속도와 회전에 따라 두 경로의 위상차가 변함</text></g></svg>
