<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>접근하는 표적에서 반사파 주파수가 높아지는 도플러 효과</title><rect width="800" height="420" fill="#f7f7f4"/><g font-family="Arial,sans-serif" fill="#222"><rect x="60" y="155" width="120" height="100" rx="10" fill="#4d77a8"/><text x="120" y="215" fill="white" text-anchor="middle" font-size="20">레이더</text><polygon points="640,155 725,205 640,255 590,205" fill="#e76f51"/><path d="M580 205 L480 205" stroke="#777" stroke-width="5"/><polygon points="480,205 510,190 510,220" fill="#777"/><text x="535" y="180" text-anchor="middle" font-size="16">접근 속도 v</text><g fill="none" stroke="#2a9d8f" stroke-width="4"><path d="M180 175 Q220 120 260 175 T340 175 T420 175 T500 175 T580 175"/><path d="M580 245 Q550 205 520 245 T460 245 T400 245 T340 245 T280 245 T220 245 T180 245"/></g><text x="375" y="105" text-anchor="middle" font-size="17">송신 주파수 f</text><text x="375" y="315" text-anchor="middle" font-size="17">접근 표적의 반사파: f + Δf</text><text x="400" y="385" text-anchor="middle" font-size="17" fill="#666">도플러 주파수로 방사 방향 속도를 추정</text></g></svg>
