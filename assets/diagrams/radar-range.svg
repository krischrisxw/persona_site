<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>레이더 펄스의 왕복 시간으로 거리를 계산하는 구조</title><rect width="800" height="420" fill="#f7f7f4"/><g font-family="Arial,sans-serif" fill="#222"><rect x="65" y="145" width="145" height="130" rx="10" fill="#4d77a8"/><text x="137" y="205" fill="white" text-anchor="middle" font-size="21">레이더</text><text x="137" y="235" fill="white" text-anchor="middle" font-size="15">송신·수신</text><polygon points="660,145 735,210 660,275 610,210" fill="#e76f51"/><text x="675" y="325" text-anchor="middle" font-size="18">표적</text><path d="M210 175 L610 175" stroke="#2a9d8f" stroke-width="7"/><polygon points="610,175 580,160 580,190" fill="#2a9d8f"/><path d="M610 245 L210 245" stroke="#e76f51" stroke-width="7"/><polygon points="210,245 240,230 240,260" fill="#e76f51"/><text x="410" y="145" text-anchor="middle" font-size="17">송신 펄스</text><text x="410" y="285" text-anchor="middle" font-size="17">반사 신호</text><text x="400" y="380" text-anchor="middle" font-size="21">거리 R = 빛의 속도 c × 왕복 시간 Δt ÷ 2</text></g></svg>
