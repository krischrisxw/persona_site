<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>코드를 읽을 때 먼저 보는 것들 — krischris</title><link rel="stylesheet" href="../style.css"></head><body><main class="article"><a class="back" href="../">← All posts</a><p class="eyebrow">NOTE 02</p><h1>코드를 읽을 때 먼저 보는 것들</h1><time datetime="2026-08-04">2026.08.04</time><p>새 코드베이스에서는 파일을 많이 읽기보다 실행되는 흐름을 먼저 찾는다. 시작점, 입력, 출력, 그리고 실패할 때의 경로를 따라가면 구조가 빨리 보인다.</p><p>그 다음에야 이름과 구현을 자세히 본다. 작은 질문을 하나씩 해결하는 편이 문서부터 읽는 것보다 오래 기억에 남는다.</p></main></body></html>
